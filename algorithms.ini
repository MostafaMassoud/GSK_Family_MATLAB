; ============================================================================
;  algorithms.ini - algorithm aliases for the run_all_cec*.m launchers
; ============================================================================
;
;  An alias is a name you choose for an algorithm + its settings. Use the
;  alias in a launcher like any algorithm name:
;
;      optimizers = {'gsk', 'gsk-np50'};    % in run_all_cec2017.m
;
;  'gsk' runs with its original settings; 'gsk-np50' runs the GSK code with
;  the settings of its [gsk-np50] section below. Each name gets its own
;  results folder (results/_run_all/<name>/<suite>/), so nothing is
;  overwritten, and run_compare_algorithms.m compares them like any other
;  algorithms.
;
;  How to write an alias:
;    [name]          lower-case letters, digits and hyphens, e.g. [gsk-np50].
;                    Not the name of an existing algorithm.
;    base = gsk      required: the algorithm whose code it runs (one of the
;                    seven, or your own, e.g. my-gsk).
;    setting = value any other line changes one setting. Settings you leave
;                    out keep the base's original value.
;    ; comment       a line (or the end of a line) starting with ; is ignored.
;  Values: a number (0.7), a list ([0.3 0.5 0.7]), a range (0.2:0.1:0.8),
;  true or false.
;
;  To use an example below, remove the ; at the start of its lines.
;
;  Good to know:
;    - All aliases get the same seeds as the other algorithms, so the
;      comparison stays fair.
;    - Changed settings are recorded in each run's summary/environment.json
;      and listed in the settings table of run_compare_algorithms.m.
;    - A misspelled setting stops the run and lists the accepted ones.
;    - After editing an alias that already has results, give it a new name
;      (or delete its results folder): the runner refuses to mix settings.
;    - A population size other than the original must be reported as a
;      changed setting in a paper (the results no longer match the
;      published ones).
;
; ----------------------------------------------------------------------------
;  The settings of each algorithm, with their original values
; ----------------------------------------------------------------------------
;  gsk         np_init = 100, kf = 0.5, kr = 0.9, k = 10, p = 0.1
;  agsk        np_init = 100, min_pop_size = 12
;  apgsk       np_init = 100, min_pop_size = 12
;  fdb-agsk    np_init = 100, min_pop_size = 12, fdb_case = 1   (cases 1 to 5)
;  atmals-gsk  np_init = 100, kf_pool = 0.2:0.1:0.8, kr_pool = 0.85:0.01:1,
;              k_pool = 8:30, p_pool = 0.05:0.01:0.15, pls_pool = 1:0.1:2
;              (each pool must contain 0.5, 0.9, 10, 0.1 and 1 respectively)
;  egsk        np_init = 100, kf1 = 0.5, kf2 = 0.5, kr = 1, k = 10,
;              use_fmincon = true
;  dt-gsk      np_init = 5*D, min_pop_size = 12 (25 when D >= 50)
;  your own    np_init, min_pop_size, and every option its file reads,
;              e.g. alpha read with local_option(options, 'alpha', 0.3)
;
;  np_init is the starting population size, min_pop_size the final size
;  after population reduction (agsk, apgsk, fdb-agsk, dt-gsk only).
;
; ----------------------------------------------------------------------------
;  Examples (remove the ; to use one)
; ----------------------------------------------------------------------------

; Standardized population size for every algorithm in a comparison
;[gsk-np50]
;base    = gsk
;np_init = 50

;[my-gsk-np50]
;base    = my-gsk
;np_init = 50

; GSK with other knowledge factor and ratio
;[gsk-kf07]
;base = gsk
;kf   = 0.7
;kr   = 0.8

; AGSK with a larger final population
;[agsk-min20]
;base         = agsk
;np_init      = 100
;min_pop_size = 20

; FDB-AGSK, guide case 3
;[fdb-agsk-c3]
;base     = fdb-agsk
;fdb_case = 3

; ATMALS-GSK with a narrower KF pool (must still contain 0.5)
;[atmals-gsk-kf]
;base    = atmals-gsk
;kf_pool = 0.3:0.1:0.7

; eGSK without the late fmincon local search (not the published setting)
;[egsk-nols]
;base        = egsk
;use_fmincon = false

; DT-GSK with the same starting population as the others
;[dt-gsk-np100]
;base    = dt-gsk
;np_init = 100

; Your own variant with another value of its own parameter. Works once your
; file reads it, e.g. alpha = local_option(options, 'alpha', 0.3); until then
; the run stops with "unknown setting alpha" and lists the accepted ones.
;[my-gsk-a5]
;base  = my-gsk
;alpha = 0.5
