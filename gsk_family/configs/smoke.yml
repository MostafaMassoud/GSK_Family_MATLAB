# Quick end-to-end smoke test: one optimizer, one function, tiny budget.
# Run with: gsk_run --config configs/smoke.yml --root .
optimizers: [gsk]
suite: cec2017
dimensions: [10]
functions: [1]
runs: 1
seed: 20240620
seed_policy: reference
rand_generator: threefry
max_evaluations: 2000
overwrite: true
np_init: 0  # 0 = each optimizer's default (100; dt-gsk 5*D); e.g. 100 = same initial NP for all
min_pop_size: 0  # 0 = default final NP (12; dt-gsk 25 for D >= 50); agsk, apgsk, fdb-agsk, dt-gsk only
