# Continuous integration for the C++ side of gsk_family.
#
# Builds and tests the C++ benchmark library and CLIs on Linux and Windows
# with warnings as errors, runs the tests under ASan/UBSan, and checks the
# language and folder rules (MATLAB and C++ only). MATLAB does not run here
# (it needs a license); run the MATLAB optimizer smoke tests locally - see
# README.md "MATLAB tests".
#
# Assumes gsk_family is the repository root. If it is a subdirectory, set
# `defaults.run.working-directory` and the checkout path to match.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux sets the compiler explicitly. Windows leaves it unset so
          # CMake uses the default Visual Studio generator and MSVC
          # (-DCMAKE_CXX_COMPILER=cl is ignored or fails with that generator).
          - os: ubuntu-latest
            cxx: g++
            cmake_compiler: "-DCMAKE_CXX_COMPILER=g++"
          - os: ubuntu-latest
            cxx: clang++
            cmake_compiler: "-DCMAKE_CXX_COMPILER=clang++"
          - os: windows-latest
            cxx: MSVC
            cmake_compiler: ""
    steps:
      - uses: actions/checkout@v4

      - name: Configure (warnings as errors)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGSKCEC_WERROR=ON
          ${{ matrix.cmake_compiler }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ASan + UBSan (ubuntu, clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-san -j
      - name: Test under sanitizers
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  # Fails if a forbidden file or top-level folder is present.
  contract-checks:
    name: language & folder contract (MATLAB and C++ only, no merged suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only MATLAB and C++ sources (no foreign sources or cec2013.cpp)
        run: |
          set -e
          if find . -path ./build -prune -o -type f \( -name '*.py' -o -name '*.pyx' -o -name 'cec2013.cpp' \) -print | grep .; then
            echo "::error::forbidden file(s) found"; exit 1
          fi
          echo "ok: only MATLAB and C++ sources"
      - name: No .m/.R/.c under cec_suite_cpp
        run: |
          set -e
          if find benchmarks/cec_suite_cpp -type f \( -name '*.m' -o -name '*.R' -o -name '*.c' \) -print | grep .; then
            echo "::error::non-C++ source under cec_suite_cpp"; exit 1
          fi
          echo "ok: cec_suite_cpp is C++ only"
      - name: No forbidden top-level folders
        run: |
          set -e
          for d in include tests matlab; do
            if [ -d "$d" ]; then echo "::error::forbidden top-level folder: $d"; exit 1; fi
          done
          echo "ok: no top-level include/tests/matlab"
